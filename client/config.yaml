# This file is re-read periodically by the daemon

interface: eth0

check_interval_seconds: 120

translation_cleanup_interval_seconds: 5
cpu_threshold: 5.0
timestamp_threshold_seconds: 60
force_cleanup_every: 20

servers:
  - name: server_query
    server_ip: 192.0.2.10
    http_port: 8000
    service_port: 8080     # Port of the protected service (eBPF key)
    endpoint: /config
    
    # Keys are generated on the fly and never saved
    last_sent_at: 2024-01-01T00:00:00Z
    
    duration_seconds: 86400  # 24h
    
    # Probability range (0-100): eBPF picks a random value in the range every 3s
    padding_prob_min: 0
    padding_prob_max: 100
    dummy_prob_min: 0
    dummy_prob_max: 100
    frag_prob_min: 0
    frag_prob_max: 100

  - name: server_res
    server_ip: 192.0.2.10
    http_port: 8000
    service_port: 8081     # Port of the protected service (eBPF key)
    endpoint: /config

    # Keys are generated on the fly and never saved
    last_sent_at: 2024-01-01T00:00:00Z

    duration_seconds: 86400  # 24h

    # Probability range (0-100): eBPF picks a random value in the range every 3s
    padding_prob_min: 0
    padding_prob_max: 100
    dummy_prob_min: 0
    dummy_prob_max: 100
    frag_prob_min: 0
    frag_prob_max: 100

