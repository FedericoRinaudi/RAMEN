[package]
name = "experiment-client"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
tokio = { version = "1.36", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }

[[bin]]
name = "query-client"
path = "src/query_client.rs"

[[bin]]
name = "resolution-client"
path = "src/resolution_client.rs"
